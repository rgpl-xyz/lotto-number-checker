<div class="winning-input-container" [formGroup]="form">
  <p class="instruction">Enter or paste {{ controlIndices.length }} numbers between {{ lowest }} and {{ highest }}.</p>

  <div class="number-inputs" formArrayName="numbers">
    @for (i of controlIndices; track i) {
      <div class="input-container">
        <label [for]="'number-input-' + i" class="input-label visually-hidden"
          >Number {{ i + 1 }}</label
        >
        <input
          type="number"
          [min]="lowest"
          [max]="highest"
          [id]="'number-input-' + i"
          [formControlName]="i"
          appDigitsOnly
          [attr.aria-invalid]="isFaulty(i) || null"
          [attr.aria-describedby]="isFaulty(i) ? 'winning-problem' : null"
          (paste)="parseInputString($event)"
          (keydown)="handleKeyDown($event, i)"
          class="number-input"
        />
      </div>
    }
  </div>

  <p id="winning-problem" class="field-problem" aria-live="polite">{{ problem()?.message }}</p>

  <button
    class="submit-button"
    [disabled]="form.invalid"
    (click)="submitWinningNumbers()"
  >
    Set Winning Numbers
  </button>
</div>
