# Lotto Number Checker: https://lotto.app.rgpl.xyz
#
# Static Angular build. deploy/deploy.sh publishes each release to
# /var/www/lotto/releases/<commit> and points /var/www/lotto/current at it.
# Installed as /etc/nginx/sites-available/lotto; `certbot --nginx --redirect`
# then adds the TLS listeners and the HTTP-to-HTTPS redirect (see deploy/README.md).

# Hashed bundles never change; index.html must be revalidated so a new release shows up.
map $uri $lotto_cache_control {
    ~*\.(?:js|css)$ "public, max-age=31536000, immutable";
    default         "no-cache";
}

server {
    server_name lotto.app.rgpl.xyz;
    listen 80;
    listen [::]:80;

    root /var/www/lotto/current;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Kept at server level only: nginx drops every inherited add_header in a
    # location that declares its own.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $lotto_cache_control always;

    # The app has a single route, so anything that isn't a built file is a real 404.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri @previous;
    }

    # A tab opened before the latest deploy still requests the old build's hashed
    # files; serve them from the previous release so the tab keeps working.
    location @previous {
        root /var/www/lotto/previous;
        try_files $uri =404;
    }
}
